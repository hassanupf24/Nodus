[project]
name = "nodus-backend"
version = "0.1.0"
description = "Nodus vNext — Local-First Private AI Memory Infrastructure"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nodus Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LLM / Agents
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Embeddings & Vector stores
    "sentence-transformers>=3.3.0",
    "qdrant-client>=1.12.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    # Database & Tasks
    "aiosqlite>=0.20.0",
    "taskiq[sqlite]>=0.11.0",
    # HTTP & async
    "httpx>=0.28.0",
    "sse-starlette>=2.1.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
