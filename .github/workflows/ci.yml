name: Nodus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/pyproject.toml"
      - name: Install dependencies
        run: cd backend && uv sync --all-extras
      - name: Run Ruff Lint
        run: cd backend && uv run ruff check .
      - name: Run Mypy
        run: cd backend && uv run mypy src
      - name: Run Pytest
        run: cd backend && uv run pytest tests --cov=src

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install JS deps
        run: cd desktop && npm ci
      - name: Run Linter
        run: cd desktop && npm run lint || echo "Linting step not configured yet"
      - name: Build Tauri App
        run: cd desktop && npm run tauri build
