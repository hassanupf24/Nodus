# ==============================================================================
# Nodus Security Scanning
# Schedule: Weekly on Monday at 06:00 UTC
# Also runs on-demand via workflow_dispatch
# ==============================================================================

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # Python Dependency Audit
  # ============================================================================
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ai-services
        run: uv sync --frozen --dev

      - name: Run pip-audit
        id: pip_audit
        working-directory: ai-services
        run: |
          uv run pip-audit \
            --require-hashes=false \
            --format=json \
            --output=pip-audit-results.json \
            --strict || echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: ai-services/pip-audit-results.json

      - name: Create issue for Python vulnerabilities
        if: steps.pip_audit.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('ai-services/pip-audit-results.json', 'utf8'));
            const vulns = results.dependencies?.filter(d => d.vulns?.length > 0) || [];

            if (vulns.length === 0) return;

            let body = '## 🔒 Python Dependency Vulnerabilities Found\n\n';
            body += `**Scan Date**: ${new Date().toISOString()}\n`;
            body += `**Total Packages with Vulnerabilities**: ${vulns.length}\n\n`;
            body += '| Package | Version | Vulnerability | Fix |\n';
            body += '|---------|---------|--------------|-----|\n';

            for (const dep of vulns) {
              for (const vuln of dep.vulns) {
                body += `| ${dep.name} | ${dep.version} | ${vuln.id} | ${vuln.fix_versions?.join(', ') || 'N/A'} |\n`;
              }
            }

            body += '\n---\n*Generated by Nodus Security Audit workflow*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Python Security: ${vulns.length} vulnerable package(s) found`,
              body: body,
              labels: ['security', 'dependencies', 'python']
            });

  # ============================================================================
  # Node.js Dependency Audit
  # ============================================================================
  node-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Run npm audit
        id: npm_audit
        working-directory: desktop-app
        run: |
          npm audit --json > npm-audit-results.json 2>&1 || echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: desktop-app/npm-audit-results.json

      - name: Create issue for Node vulnerabilities
        if: steps.npm_audit.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results;
            try {
              results = JSON.parse(fs.readFileSync('desktop-app/npm-audit-results.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse npm audit results');
              return;
            }

            const meta = results.metadata?.vulnerabilities || {};
            const total = (meta.high || 0) + (meta.critical || 0);

            if (total === 0) return;

            let body = '## 🔒 Node.js Dependency Vulnerabilities Found\n\n';
            body += `**Scan Date**: ${new Date().toISOString()}\n`;
            body += `**Critical**: ${meta.critical || 0} | **High**: ${meta.high || 0} | **Moderate**: ${meta.moderate || 0} | **Low**: ${meta.low || 0}\n\n`;

            const advisories = results.vulnerabilities || {};
            if (Object.keys(advisories).length > 0) {
              body += '| Package | Severity | Via | Fix Available |\n';
              body += '|---------|----------|-----|---------------|\n';
              for (const [name, info] of Object.entries(advisories)) {
                if (info.severity === 'high' || info.severity === 'critical') {
                  const via = Array.isArray(info.via) ? info.via.map(v => typeof v === 'string' ? v : v.title || v.name).join(', ') : '';
                  body += `| ${name} | ${info.severity} | ${via} | ${info.fixAvailable ? 'Yes' : 'No'} |\n`;
                }
              }
            }

            body += '\n---\n*Generated by Nodus Security Audit workflow*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Node.js Security: ${total} high/critical vulnerability(ies) found`,
              body: body,
              labels: ['security', 'dependencies', 'javascript']
            });

  # ============================================================================
  # Rust Dependency Audit
  # ============================================================================
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        id: cargo_audit
        working-directory: desktop-app/src-tauri
        run: |
          cargo audit --json > cargo-audit-results.json 2>&1 || echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT

      - name: Upload cargo audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-results
          path: desktop-app/src-tauri/cargo-audit-results.json

      - name: Create issue for Rust vulnerabilities
        if: steps.cargo_audit.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results;
            try {
              results = JSON.parse(fs.readFileSync('desktop-app/src-tauri/cargo-audit-results.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse cargo audit results');
              return;
            }

            const vulns = results.vulnerabilities?.list || [];
            if (vulns.length === 0) return;

            let body = '## 🔒 Rust Dependency Vulnerabilities Found\n\n';
            body += `**Scan Date**: ${new Date().toISOString()}\n`;
            body += `**Total Advisories**: ${vulns.length}\n\n`;
            body += '| Package | Advisory | Title | Patched |\n';
            body += '|---------|----------|-------|--------|\n';

            for (const vuln of vulns) {
              const advisory = vuln.advisory || {};
              const pkg = vuln.package || {};
              const patched = vuln.versions?.patched?.join(', ') || 'N/A';
              body += `| ${pkg.name || 'unknown'} | ${advisory.id || 'N/A'} | ${advisory.title || 'N/A'} | ${patched} |\n`;
            }

            body += '\n---\n*Generated by Nodus Security Audit workflow*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Rust Security: ${vulns.length} advisory(ies) found`,
              body: body,
              labels: ['security', 'dependencies', 'rust']
            });

  # ============================================================================
  # Container Image Scanning
  # ============================================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Services image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.ai-services \
            -t nodus-ai-services:scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nodus-ai-services:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy (table output for logs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nodus-ai-services:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Create issue for container vulnerabilities
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let sarif;
            try {
              sarif = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
            } catch (e) {
              console.log('No SARIF results found');
              return;
            }

            const results = sarif.runs?.[0]?.results || [];
            const criticalHigh = results.filter(r =>
              r.properties?.['security-severity'] >= 7.0
            );

            if (criticalHigh.length === 0) return;

            let body = '## 🐳 Container Image Vulnerabilities Found\n\n';
            body += `**Image**: nodus-ai-services\n`;
            body += `**Scan Date**: ${new Date().toISOString()}\n`;
            body += `**Critical/High Issues**: ${criticalHigh.length}\n\n`;

            body += 'See the Security tab for full SARIF results.\n';
            body += '\n---\n*Generated by Nodus Security Audit workflow*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐳 Container Security: ${criticalHigh.length} critical/high vulnerability(ies) found`,
              body: body,
              labels: ['security', 'container', 'infrastructure']
            });
