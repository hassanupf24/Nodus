# ==============================================================================
# Nodus — Production Docker Compose Overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d
# ==============================================================================

name: nodus

services:
  # ============================================================================
  # Core Services — Production Overrides
  # ============================================================================

  ai-services:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.ai-services
    environment:
      - NODUS_ENV=production
      - NODUS_LOG_LEVEL=warning
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=nodus-ai-services
    ports:
      - "8000:8000"
    volumes:
      - ai-data:/app/data
      - ai-models:/app/models
      - ai-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512M

  qdrant:
    ports:
      - "6333:6333"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ============================================================================
  # Monitoring Services — Production Overrides
  # ============================================================================

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
