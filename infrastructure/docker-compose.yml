# ==============================================================================
# Nodus — Development Docker Compose
# Profiles: core | monitoring | full
# Usage:
#   docker compose --profile core up -d
#   docker compose --profile monitoring up -d
#   docker compose --profile full up -d
# ==============================================================================

name: nodus

services:
  # ============================================================================
  # Core Services
  # ============================================================================

  ai-services:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.ai-services
    container_name: nodus-ai-services
    profiles: ["core", "full"]
    ports:
      - "8000:8000"
    environment:
      - NODUS_ENV=development
      - NODUS_HOST=0.0.0.0
      - NODUS_PORT=8000
      - NODUS_LOG_LEVEL=debug
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=nodus-ai-services
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
    volumes:
      - ../ai-services:/app/ai-services:cached
      - ai-data:/app/data
      - ai-models:/app/models
      - ai-logs:/app/logs
    networks:
      - nodus-net
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nodus-qdrant
    profiles: ["core", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=false
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks:
      - nodus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # Monitoring Services
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nodus-prometheus
    profiles: ["monitoring", "full"]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nodus-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: nodus-grafana
    profiles: ["monitoring", "full"]
    ports:
      - "3000:3000"
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=nodus-dev
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nodus-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: nodus-otel-collector
    profiles: ["monitoring", "full"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
      - "8889:8889"   # Prometheus exporter
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    networks:
      - nodus-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  ai-data:
    driver: local
  ai-models:
    driver: local
  ai-logs:
    driver: local
  qdrant-data:
    driver: local
  qdrant-snapshots:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  nodus-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
