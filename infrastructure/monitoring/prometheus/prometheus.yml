# ==============================================================================
# Prometheus Configuration — Nodus Monitoring
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: nodus-dev
    environment: development

# Alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager configuration (uncomment when alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# ==============================================================================
# Scrape Targets
# ==============================================================================
scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  # --------------------------------------------------------------------------
  # Nodus AI Services
  # --------------------------------------------------------------------------
  - job_name: nodus-ai-services
    scrape_interval: 10s
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - ai-services:8000
        labels:
          service: ai-services
          component: gateway

  # --------------------------------------------------------------------------
  # Qdrant Vector Database
  # --------------------------------------------------------------------------
  - job_name: qdrant
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
        labels:
          service: qdrant
          component: vector-db

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector (self-metrics)
  # --------------------------------------------------------------------------
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          service: otel-collector
          component: telemetry

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector Prometheus exporter
  # (receives metrics from instrumented services via OTLP)
  # --------------------------------------------------------------------------
  - job_name: otel-exported-metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          source: otlp
          component: telemetry

  # --------------------------------------------------------------------------
  # Node Exporter (host metrics — uncomment when deployed)
  # --------------------------------------------------------------------------
  # - job_name: node-exporter
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets:
  #         - node-exporter:9100
  #       labels:
  #         service: node-exporter
  #         component: infrastructure
