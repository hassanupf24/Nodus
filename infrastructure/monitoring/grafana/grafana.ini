# ==============================================================================
# Grafana Configuration — Nodus
# ==============================================================================

[paths]
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[session]
provider = file
provider_config = sessions

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
admin_password = nodus-dev
secret_key = nodus-dev-secret-change-in-production
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax
allow_embedding = false
strict_transport_security = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
default_theme = dark

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = true
org_name = Nodus
org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/nodus-overview.json

[alerting]
enabled = false

[unified_alerting]
enabled = true

[log]
mode = console
level = info

[log.console]
format = text

[metrics]
enabled = true

[feature_toggles]
enable =
